name: Smart Flood MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกเที่ยงคืน (UTC) หรือ 7 โมงเช้าไทย
  workflow_dispatch:    # ปุ่มกดรันเอง (Manual Trigger)

permissions:
  contents: write       # อนุญาตให้ Bot เขียนไฟล์กลับเข้า Repo ได้

jobs:
  mlops-process:
    runs-on: ubuntu-latest

    steps:
    # 1. เตรียมเครื่อง
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. ลง PyArrow ก่อนเพื่อกันเหนียว (ตัวปัญหาขาประจำ)
        pip install "pyarrow>=14.0.0" 
        
        # 2. ลง Library หลัก (ระบุเวอร์ชัน evidently ให้ชัดเจน)
        pip install pandas numpy scikit-learn xgboost "mlflow==2.17.2" joblib "evidently>=0.4.0" openmeteo-requests requests-cache retry-requests dagshub
        
        # 3. (สำคัญ) ปริ้นท์รายชื่อ Library ออกมาดูว่า evidently ถูกติดตั้งจริงไหม
        echo "=== Installed Packages ==="
        pip list
        echo "=========================="

    # 5. Prediction (ทำเสมอ ไม่ว่า Drift หรือไม่)
    - name: 5. 🔮 Run Prediction for Web
      # ไม่ใส่เงื่อนไข if เพื่อให้รันทุกครั้ง
      run: |
        echo "Running inference using the production model..."
        python src/predict_daily.py

    # 6. Save & Commit Results
    - name: 6. Commit and Push Updates
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 1. Add ไฟล์โมเดล (บังคับ Add ด้วย -f เผื่อติด gitignore)
        git add -f models/*
        
        # 2. Add ผลลัพธ์ JSON สำหรับเว็บ
        git add prediction_results.json
        
        # 3. Add ข้อมูลดิบ (Optional: ถ้าอยากเก็บ History)
        git add data/raw/raw_data.csv
        
        # เช็คสถานะ (Debug)
        git status
        
        # Commit และ Push (ถ้าไม่มีอะไรเปลี่ยนก็ข้ามไป ไม่ error)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Pipeline Output [skip ci]" && git push)