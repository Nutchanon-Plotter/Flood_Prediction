name: Smart Flood MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกเที่ยงคืน UTC (07:00 น. เวลาไทย)
  workflow_dispatch:    # ปุ่มกดรันเอง (Manual Trigger)

permissions:
  contents: write       # อนุญาตให้ Bot เขียนไฟล์กลับเข้า Repo ได้

jobs:
  mlops-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 1. ลงจาก requirements.txt (ถ้ามี)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        # 2. ลง Evidently 0.4.30 แยกตามที่ขอ (และ Fix MLflow/PyArrow กันเหนียว)
        pip install "evidently==0.4.30" "mlflow==2.17.2" "pyarrow>=14.0.0"
        
        # 3. ลง Library อื่นๆ ที่จำเป็น (เผื่อใน requirements.txt ขาด)
        pip install pandas numpy scikit-learn xgboost joblib openmeteo-requests requests-cache retry-requests dagshub

        echo "=== 📦 Installed Packages List ==="
        pip list
        echo "=================================="

    # 3. Data Pipeline (ต้องรันเรียงลำดับ)
    - name: 1. Fetch Latest Data
      run: python src/data_loader.py

    - name: 2. Preprocess & Generate Scaler
      # สร้าง scaler.pkl ใหม่ทุกครั้งเพื่อให้ version ตรงกับ environment
      run: python src/preprocess.py

    # 4. Monitoring
    - name: 3. Check for Data Drift
      id: drift_check
      run: python src/monitor.py

    # 5. Retraining (ทำเฉพาะตอนเจอ Drift)
    - name: 4. 🚨 Drift Detected - Retraining Model
      if: steps.drift_check.outputs.drift_detected == 'true'
      env: 
        # ส่ง Secret ให้ DagsHub/MLflow
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        echo "Data has drifted. Retraining the model..."
        python src/train.py

    # 6. Prediction (ทำเสมอ ไม่ว่า Drift หรือไม่)
    - name: 5. 🔮 Run Prediction for Web
      run: |
        echo "Running inference using the production model..."
        python src/predict_daily.py

# ... (Steps ก่อนหน้าเหมือนเดิม) ...

    # 7. Commit & Push (เช็ค Data Change ที่นี่)
    - name: 6. Commit and Push Updates
      id: commit_step
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Add Files
        git add -f models/*
        git add predict_result/prediction_results.json
        git add web/frontend/public/prediction_results.json
        git add -f data/raw/raw_data.csv
        
        # --- เช็คว่า Data เปลี่ยนไหม? ---
        if git diff --name-only --cached | grep -q "data/raw/raw_data.csv"; then
          # สร้างชื่อ Tag (เช่น data-20251125)
          NEW_TAG="data-$(date +'%Y%m%d-%H%M%S')"
          
          # ส่งค่าตัวแปรไปใช้ใน Step ถัดไป
          echo "DATA_CHANGED=true" >> $GITHUB_ENV
          echo "TAG_NAME=$NEW_TAG" >> $GITHUB_ENV
          
          echo "📊 Data changed! Scheduled for release: $NEW_TAG"
        else
          echo "DATA_CHANGED=false" >> $GITHUB_ENV
          echo "No data change."
        fi
        
        # Commit & Push
        git diff --cached --quiet || (git commit -m "Auto-update: Pipeline Output [skip ci]" && git push)

    # 8. [ใหม่] สร้าง Release และแนบไฟล์ Data (เฉพาะตอน Data เปลี่ยน)
    - name: 7. Create Data Release
      if: env.DATA_CHANGED == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Data Update: ${{ env.TAG_NAME }}"
        body: "New data fetched from Open-Meteo API."
        files: data/raw/raw_data.csv
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}