name: Smart Flood MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกเที่ยงคืน (UTC) หรือ 7 โมงเช้าไทย
  workflow_dispatch:    # ปุ่มกดรันเอง (Manual Trigger)

permissions:
  contents: write       # อนุญาตให้ Bot เขียนไฟล์กลับเข้า Repo ได้

jobs:
  mlops-process:
    runs-on: ubuntu-latest

    steps:
    # 1. เตรียมเครื่อง
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ระบุ mlflow version ที่เข้ากันได้กับ DagsHub
        pip install pandas numpy scikit-learn xgboost mlflow==2.17.2 joblib evidently openmeteo-requests requests-cache retry-requests dagshub

    # 2. Data Pipeline (ต้องรันเรียงลำดับ)
    
    - name: 1. Fetch Latest Data
      run: python src/data_loader.py

    - name: 2. Preprocess & Generate Scaler
      # สำคัญมาก! ต้องรันเพื่อสร้าง models/scaler.pkl ให้ขั้นตอนต่อไปใช้
      run: python src/preprocess.py

    # 3. Monitoring
    - name: 3. Check for Data Drift
      id: drift_check  # ตั้ง ID เพื่อส่งค่าไปยัง Step ถัดไป
      run: python src/monitor.py

    # 4. Retraining (ทำเฉพาะตอนเจอ Drift)
    - name: 4. 🚨 Drift Detected - Retraining Model
      if: steps.drift_check.outputs.drift_detected == 'true'
      env: 
        # ส่ง Secret ให้ DagsHub/MLflow
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        echo "Data has drifted. Retraining the model..."
        python src/train.py

    # 5. Prediction (ทำเสมอ ไม่ว่า Drift หรือไม่)
    - name: 5. 🔮 Run Prediction for Web
      # ไม่ใส่เงื่อนไข if เพื่อให้รันทุกครั้ง
      run: |
        echo "Running inference using the production model..."
        python src/predict_daily.py

    # 6. Save & Commit Results
    - name: 6. Commit and Push Updates
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 1. Add ไฟล์โมเดล (บังคับ Add ด้วย -f เผื่อติด gitignore)
        git add -f models/*
        
        # 2. Add ผลลัพธ์ JSON สำหรับเว็บ
        git add prediction_results.json
        
        # 3. Add ข้อมูลดิบ (Optional: ถ้าอยากเก็บ History)
        git add data/raw/raw_data.csv
        
        # เช็คสถานะ (Debug)
        git status
        
        # Commit และ Push (ถ้าไม่มีอะไรเปลี่ยนก็ข้ามไป ไม่ error)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Pipeline Output [skip ci]" && git push)