name: Smart Flood MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกเที่ยงคืน
  workflow_dispatch:    # กดรันเองได้

permissions:
  contents: write       # อนุญาตให้ bot save ไฟล์กลับเข้า repo

jobs:
  mlops-process:
    runs-on: ubuntu-latest

    steps:
    # 1. เตรียมเครื่อง
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ถ้ามีไฟล์ requirements.txt ให้ใช้บรรทัดนี้:
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # - name: Fetch Latest Data
    #   run: python src/data_loader.py

    # - name: Check for Data Drift
    #   id: drift_check
    #   run: python src/monitor.py

    - name: 🚨 Drift Detected - Retraining Model
      #if: steps.drift_check.outputs.drift_detected == 'true'
      env: 
        # [ส่วนที่เพิ่ม] ส่งตัวแปร Authentication ให้ MLflow
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        echo "Data has drifted. Retraining the model..."
        python src/train.py

    # - name: Run Prediction for Web
    #   run: |
    #     echo "Running inference using the latest model..."
    #     python src/predict_daily.py

    # Save Changes
    - name: Commit and Push Updates
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Pipeline Processed" && git push)